ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: true
vif_only: true
hide_vpn_icon: false
geoip_db_url: https://github.com/xream/geoip/releases/latest/download/ipinfo.country.mmdb
asn_db_url: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://www.apple.com/library/test/success.html
direct_latency_test_url: http://www.baidu.com
compat_route: true
include_all_networks: false
dns:
  bootstrap:
  - system
  upstreams:
    Global DNS:
    - quic://223.5.5.5:853
    - quic://223.6.6.6:853
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - quic://dns.cloudflare.com:784
    - https://dns.google/dns-query
    - https://dns.cloudflare.com/dns-query
    - quic://dns.quad9.net:784
  forward:
  - wildcard:
      match: '*'
      value: Global DNS
